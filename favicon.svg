<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <style>
    .icon { fill: #5f6368; }
    @media (prefers-color-scheme: dark) { .icon { fill: #c4c7c5; } }
  </style>
  <defs>
    <!-- Picture-frame glyph: white keeps, black cuts out (mountains + moon) -->
    <mask id="cut">
      <rect width="24" height="24" fill="#fff"/>
      <path d="M5.5 18 L10 12.5 L13 16 L15 13.5 L18.5 18 Z" fill="#000"/>
      <circle cx="15.5" cy="8.5" r="2" fill="#000"/>
    </mask>
  </defs>
  <rect class="icon" x="2.5" y="2.5" width="19" height="19" rx="4" mask="url(#cut)"/>
</svg>
